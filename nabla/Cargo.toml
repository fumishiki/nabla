[package]
name = "nabla"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0 OR MIT"
description = "Type-safe linear algebra DSL for Rust — zero-copy, compile-time backend selection"
keywords = ["linear-algebra", "tensor", "einsum", "gpu", "math"]
categories = ["mathematics", "science"]

[features]
default = ["cpu"]
cpu = ["nabla-core/cpu"]
gpu = ["nabla-core/gpu"]
cuda = ["nabla-core/cuda"]
hip = ["nabla-core/hip"]

[dependencies]
nabla-core = { path = "../nabla-core" }
half = { version = "2", features = ["num-traits"] }
nabla-macros = { path = "../nabla-macros" }
egg = "0.9"
ordered-float = "4"
rayon = "1"

[dev-dependencies]
trybuild = "1"
